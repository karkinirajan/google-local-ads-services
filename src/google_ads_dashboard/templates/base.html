<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Google Ads Dashboard{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="container py-4">
      <header class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
          <a href="{{ url_for('views.index') }}" class="text-decoration-none text-reset">Google Ads Dashboard</a>
        </h1>
        {% if current_user.is_authenticated %}
        <form method="post" action="{{ url_for('views.logout') }}" class="d-flex align-items-center gap-2">
          <span class="text-muted small">{{ current_user.email }}</span>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <button class="btn btn-outline-secondary btn-sm" type="submit">Sign out</button>
        </form>
        {% else %}
        <a class="btn btn-primary" href="{{ url_for('views.login') }}">Sign in with Google</a>
        {% endif %}
      </header>
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
